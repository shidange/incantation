<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>咒语</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --text:#e8e6e1; --dim:#8a8778;
    --accent:#d4a24e; --accent2:#6ea87a; --danger:#c0564e; --line:#2a2e38;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px 40px; max-width:560px; margin-inline:auto;}
  h1{font-size:20px; font-weight:600; letter-spacing:4px; text-align:center; margin:12px 0 2px;}
  .sub{text-align:center; color:var(--dim); font-size:12px; margin-bottom:6px;}
  .syncBar{text-align:center; font-size:11px; color:var(--dim); margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:6px;}
  .syncDot{width:7px; height:7px; border-radius:50%; background:var(--dim); display:inline-block;}
  .syncDot.ok{background:var(--accent2);}
  .syncDot.err{background:var(--danger);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px 16px; margin-bottom:16px; transition:border-color .25s, box-shadow .25s;}
  .card.flash{border-color:var(--accent2); box-shadow:0 0 0 2px rgba(110,168,122,.35);}
  .card.abort{border-color:var(--danger); box-shadow:0 0 0 2px rgba(192,86,78,.3);}
  .zh{font-size:19px; line-height:1.65; margin-bottom:8px;}
  .en{font-size:14px; line-height:1.55; color:var(--dim); font-style:italic; margin-bottom:14px;}
  .char{transition:color .12s; border-radius:3px;}
  .char.done{color:var(--accent2); font-weight:600;}
  .char.abort{color:var(--danger);}
  .track{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;}
  .track .label{width:54px; font-size:13px; color:var(--dim); flex-shrink:0;}
  button{border:none; border-radius:11px; padding:9px 14px; font-size:13px;
    font-weight:600; color:#0f1115; background:var(--accent); cursor:pointer; transition:opacity .15s, transform .1s;}
  button:active{transform:scale(.98);}
  button.secondary{background:#2b303c; color:var(--text);}
  button.playing{background:var(--accent2); color:#0f1115;}
  button.readBtn{background:#262b36; color:var(--accent); border:1px solid rgba(212,162,78,.45);}
  button.readBtn.active{background:var(--accent2); color:#0f1115; border-color:var(--accent2);}
  .meterWrap{margin-top:12px; display:none; flex-direction:column; gap:6px; padding-top:10px; border-top:1px dashed var(--line);}
  .meterWrap.on{display:flex;}
  .meterTop{display:flex; justify-content:space-between; align-items:center; font-size:12px;}
  .meterLabel{color:var(--dim);}
  .meterText{color:var(--dim); font-weight:500;}
  .meterText.speaking{color:var(--accent2); font-weight:600;}
  .meterText.warn{color:var(--danger);}
  .meterBg{width:100%; height:8px; background:#12141a; border-radius:99px; overflow:hidden; border:1px solid var(--line);}
  .meterFill{height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .12s ease, background .15s;}
  .meterFill.done{background:var(--accent2);}
  .meterFill.warn{background:var(--danger);}
  .heardBox{font-size:12px; color:var(--dim); min-height:16px;}
  .counts{margin-top:14px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--dim); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;}
  .countMain{color:var(--text); font-weight:600;}
  .countSub{font-size:12px; color:var(--dim);}
  .historyRow{margin-top:8px; display:flex; gap:5px; align-items:center; font-size:11px; color:var(--dim); flex-wrap:wrap;}
  .dayPill{background:#12141a; border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-size:11px;}
  .dayPill.has{border-color:rgba(110,168,122,.5); color:var(--accent2);}
  .hint{color:var(--dim); font-size:12px; text-align:center; margin-top:20px; line-height:1.8;}
  .status{font-size:12px; color:var(--accent); min-height:18px; margin-top:8px;}
  .status.warn{color:var(--danger);}
  .status.ok{color:var(--accent2);}
</style>
</head>
<body>
<h1>咒 语</h1>
<div class="sub">听是提示（不计数） · 必须从头到尾完整读完才 +1</div>
<div class="syncBar">
  <span class="syncDot" id="syncDot"></span>
  <span id="syncText">正在连接云端数据库…</span>
</div>
<div id="cards"></div>
<div class="hint">
  <b>严格完读计数规则：</b><br>
  • <b>🎙️ 循环读</b>：按顺序逐段核验你念出的字词（文字实时变绿点亮）。<b>必须从第一句按顺序念到句尾最后一个词</b>才自动 +1 并同步云端；中途停下或跳读一律作废不计数。<br>
  • <b>🔊 循环听</b>：直接用系统语音朗读提示，只听不计数；与「循环读」同开即为「领读一遍 → 等你完整跟读完 +1 → 再播下一遍」。
</div>

<script>
const API_BASE = "https://incantation.shidan.workers.dev";

const SCRIPTS = [
  { id:"sleep",
    zh:"因为我是长期主义者，11点一到，我合上电脑睡觉，因为我赚十年，不赚这一小时。",
    en:"Because I am a long-term thinker, at 11 I close the laptop and sleep, because I take the decade, not the hour.",
    minMs:{zh:2800, en:2800},
    zhCheckpoints:[
      { patterns:["因为我是","因为我","由于我是","我是"], charEnd:5 },
      { patterns:["长期主义","长期","常期","长久","主义","主意"], charEnd:10 },
      { patterns:["11点","11:","十一点","1到","一到","一道","一刀","遇到","移到","已到","点到"], charEnd:16 },
      { patterns:["合上","和尚","河上","何上","关上","盒上","电脑","睡觉","水饺"], charEnd:24 },
      { patterns:["赚10年","转10年","传10年","攒10年","占10年","算10年","10年","十年","食年","石年","时年","实年","赚十","赚10"], charEnd:31 },
      { patterns:["1小时","一小时","个小时","小时","小食","小石","消逝","消失","少时","不赚这","不转这","不攒这","这一小","这1小"], charEnd:38 }
    ],
    enCheckpoints:[
      { patterns:["because","i am","i'm"], wordEnd:4 },
      { patterns:["long","thinker","term"], wordEnd:6 },
      { patterns:["11","eleven","close"], wordEnd:10 },
      { patterns:["laptop","computer","sleep"], wordEnd:14 },
      { patterns:["take","decade","ten"], wordEnd:19 },
      { patterns:["hour","our","not the"], wordEnd:22 }
    ]
  },
  { id:"read",
    zh:"因为我读什么就变成什么，一闲下来我就读书，因为每一页都在复利。",
    en:"Because I become what I read, whenever I'm free I read, because every page compounds.",
    minMs:{zh:2600, en:2500},
    zhCheckpoints:[
      { patterns:["因为我读","读什么","因为我"], charEnd:6 },
      { patterns:["就变成","变成什么","变成"], charEnd:12 },
      { patterns:["闲下来","停下来","先下来","闲下","弦下来","显下来","嫌下来","下来"], charEnd:16 },
      { patterns:["我就读","就读书","读书","读数"], charEnd:21 },
      { patterns:["每一页","每1页","每页","都在","美1页","每一夜","每1夜"], charEnd:28 },
      { patterns:["复利","富丽","福利","付力","付立","负力","得利","狐狸","发力","复立","腹立"], charEnd:31 }
    ],
    enCheckpoints:[
      { patterns:["because","become"], wordEnd:3 },
      { patterns:["what","read"], wordEnd:6 },
      { patterns:["whenever","free"], wordEnd:9 },
      { patterns:["read","red"], wordEnd:11 },
      { patterns:["every","page"], wordEnd:14 },
      { patterns:["compound","compounds"], wordEnd:15 }
    ]
  }
];
const LANGS=[{k:"zh",label:"中文",srLang:"zh-CN"},{k:"en",label:"English",srLang:"en-US"}];

// ---------- Local + Cloud D1 Database Sync ----------
const today=()=>{
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};

let cloudHistory = [];

function getLocalCounts(id){
  const c=JSON.parse(localStorage.getItem("count_"+id)||"{}");
  return {
    today:(c.d===today()?c.t:0),
    today_zh:(c.d===today()?(c.t_zh||0):0),
    today_en:(c.d===today()?(c.t_en||0):0),
    total:c.total||0
  };
}

function saveLocalCounts(id, todayCount, totalCount, todayZh, todayEn){
  localStorage.setItem("count_"+id, JSON.stringify({
    d:today(), t:todayCount, total:totalCount, t_zh:todayZh||0, t_en:todayEn||0
  }));
}

function setSyncStatus(stateStr, msg){
  const dot=document.getElementById("syncDot");
  const txt=document.getElementById("syncText");
  if(dot) dot.className="syncDot"+(stateStr?" "+stateStr:"");
  if(txt) txt.textContent=msg;
}

function applyCloudData(data){
  if(!data || !data.ok) return;
  cloudHistory = data.history || [];
  SCRIPTS.forEach(sc=>{
    const local = getLocalCounts(sc.id);
    const remote = (data.scripts && data.scripts[sc.id]) || {today:0, total:0, today_zh:0, today_en:0};
    const mergedToday = Math.max(local.today, remote.today);
    const mergedTotal = Math.max(local.total, remote.total, mergedToday);
    saveLocalCounts(sc.id, mergedToday, mergedTotal, remote.today_zh, remote.today_en);
    renderCounts(sc.id);
  });
}

async function initCloudSync(){
  try{
    const items={};
    SCRIPTS.forEach(sc=>{ items[sc.id]=getLocalCounts(sc.id); });
    const res = await fetch(`${API_BASE}/api/sync`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date:today(), items})
    });
    const data = await res.json();
    if(data && data.ok){
      applyCloudData(data);
      setSyncStatus("ok","云端已同步（Cloudflare D1 数据库）");
    }else{
      setSyncStatus("err","云端返回异常，当前使用本地缓存");
    }
  }catch(e){
    setSyncStatus("err","离线模式（联网后自动同步至云端）");
  }
}

async function bump(id, lang){
  const c = getLocalCounts(id);
  const newToday = c.today + 1;
  const newTotal = c.total + 1;
  const newZh = c.today_zh + (lang==="zh"?1:0);
  const newEn = c.today_en + (lang==="en"?1:0);
  saveLocalCounts(id, newToday, newTotal, newZh, newEn);
  renderCounts(id);
  flashCard(id, "flash");
  playDing();

  setSyncStatus("", "正在同步 +1 到云端…");
  try{
    const res = await fetch(`${API_BASE}/api/bump`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({script_id:id, lang, date:today()})
    });
    const data = await res.json();
    if(data && data.ok){
      applyCloudData(data);
      setSyncStatus("ok", `云端已保存 ✓（刚刚 +1）`);
    }
  }catch(e){
    setSyncStatus("err", "已存本地（待联网同步云端）");
  }
}

function flashCard(id, cls){
  const card=document.getElementById("card_"+id);
  if(!card) return;
  card.classList.remove("flash","abort");
  card.classList.add(cls);
  setTimeout(()=>card.classList.remove(cls), 600);
}

// ---------- audio feedback ----------
let sharedAudioCtx=null;
function getAudioCtx(){
  if(!sharedAudioCtx) sharedAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(sharedAudioCtx.state==="suspended") sharedAudioCtx.resume();
  return sharedAudioCtx;
}
function playDing(){
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(528, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(704, ctx.currentTime+0.14);
    gain.gain.setValueAtTime(0.09, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.31);
  }catch(e){}
}

// ---------- per-track state ----------
const state={};
let activeReadKey=null;
let micStream=null, micAnalyser=null, micSource=null, vadTimer=null;
let srInstance=null;
let wakeLock=null;

async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); }
    else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
function anyActive(){
  return Object.values(state).some(x=>x.looping) || !!activeReadKey;
}

// ---------- Render sentence characters/words ----------
function renderSentenceHtml(sc, lang){
  const text = sc[lang];
  if(lang==="zh"){
    return text.split("").map((ch,i)=>`<span class="char" id="ch_${sc.id}_zh_${i}">${ch}</span>`).join("");
  }else{
    const words = text.split(" ");
    return words.map((w,i)=>`<span class="char" id="ch_${sc.id}_en_${i}">${w}</span>`).join(" ");
  }
}

function highlightUpto(key, count, cls="done"){
  const s=state[key]; if(!s) return;
  const sc=SCRIPTS.find(x=>x.id===s.scriptId);
  const total = s.lang==="zh" ? sc.zh.length : sc.en.split(" ").length;
  for(let i=0;i<total;i++){
    const el=document.getElementById(`ch_${s.scriptId}_${s.lang}_${i}`);
    if(!el) continue;
    el.classList.remove("done","abort");
    if(i < count) el.classList.add(cls);
  }
}

// ---------- 🔊 循环听（免录音，直接用系统自然语音朗读，只听不计数） ----------
function speakOnce(key){
  const s=state[key];
  if(!s || !s.looping) return;
  const sc=SCRIPTS.find(x=>x.id===s.scriptId);
  const langObj=LANGS.find(l=>l.k===s.lang);
  if(!("speechSynthesis" in window)){
    setStatus(s.scriptId,"当前浏览器不支持语音合成朗读","warn");
    stopListenLoop(key);
    return;
  }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(sc[s.lang]);
  u.lang=langObj.srLang;
  u.rate=0.95;
  s.playingNow=true;
  u.onend=()=>{
    s.playingNow=false;
    if(!s.looping) return;
    if(activeReadKey===key){
      resetReadAttempt(key);
      s.waitingForPrompt=false;
      setStatus(s.scriptId,"提示播完 —— 请从第一字到最后一字完整跟读（未读完不计数）","");
      updateMeterUI(s.scriptId, 0, "请从头完整跟读…", "idle");
    }else{
      setStatus(s.scriptId,"循环听中（只听不计数）…","");
      s.timer=setTimeout(()=>{
        if(s.looping) speakOnce(key);
      }, 1800);
    }
  };
  u.onerror=()=>{
    s.playingNow=false;
  };
  window.speechSynthesis.speak(u);
}

function toggleListenLoop(key){
  const s=state[key];
  if(s.looping){ stopListenLoop(key); return; }
  Object.keys(state).forEach(k=>{ if(k!==key) stopListenLoop(k); });
  if(activeReadKey && activeReadKey!==key) stopReadLoop(activeReadKey);

  s.looping=true; keepAwake(true);
  const btn=document.getElementById("play_"+key);
  btn.textContent="停止听"; btn.classList.add("playing");

  if(activeReadKey===key){
    s.waitingForPrompt=true;
    setStatus(s.scriptId,"领读播放中…（听完请完整跟读整句）","");
  }else{
    setStatus(s.scriptId,"循环听中（只听不计数）…","");
  }
  speakOnce(key);
}

function stopListenLoop(key){
  const s=state[key]; if(!s) return;
  s.looping=false; s.playingNow=false;
  if(s.timer) clearTimeout(s.timer);
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  const btn=document.getElementById("play_"+key);
  if(btn){ btn.textContent="🔊 循环听"; btn.classList.remove("playing"); }
  if(activeReadKey===key){
    s.waitingForPrompt=false;
    setStatus(s.scriptId,"循环读已开启 —— 必须从头念到句尾才计数","");
  }else{
    setStatus(s.scriptId,"","");
  }
  keepAwake(anyActive());
}

// ---------- 严格顺序关卡完读检测 ----------
const VAD_THRESHOLD = 0.018;
const ABORT_SILENCE_MS = 2500;
const TICK_MS = 50;

function normalizeText(raw, lang){
  if(lang==="zh"){
    return raw.replace(/\s+/g,"")
      .replace(/11:00|11：00|11\.00|十一点/g,"11点")
      .replace(/十一/g,"11")
      .replace(/十年/g,"10年")
      .replace(/一个小时|1个小时|一小时/g,"1小时")
      .replace(/一到/g,"1到")
      .replace(/每一页/g,"每1页");
  }else{
    return raw.toLowerCase().replace(/[^a-z0-9\s]/g," ");
  }
}

function checkSequentialCheckpoints(key, fullTranscript){
  const s=state[key];
  const sc=SCRIPTS.find(x=>x.id===s.scriptId);
  const cps = s.lang==="zh" ? sc.zhCheckpoints : sc.enCheckpoints;
  const norm = normalizeText(fullTranscript || "", s.lang);
  if(!norm) return {passed:s.passedStages||0, total:cps.length, highlightCount:s.highlightCount||0, finished:false};

  let searchFrom = 0;
  let passed = 0;
  let highlightCount = 0;

  for(let i=0; i<cps.length; i++){
    const cp = cps[i];
    let bestPos = -1;
    let bestLen = 0;
    for(const pat of cp.patterns){
      const idx = norm.indexOf(pat, searchFrom);
      if(idx !== -1 && (bestPos === -1 || idx < bestPos)){
        bestPos = idx;
        bestLen = pat.length;
      }
    }
    if(bestPos !== -1){
      passed = i + 1;
      highlightCount = s.lang==="zh" ? cp.charEnd : cp.wordEnd;
      searchFrom = bestPos + bestLen;
    }else{
      if(i < cps.length - 1){
        const nextCp = cps[i+1];
        let nextPos = -1, nextLen = 0;
        for(const pat of nextCp.patterns){
          const idx = norm.indexOf(pat, searchFrom);
          if(idx !== -1 && (nextPos === -1 || idx < nextPos)){
            nextPos = idx; nextLen = pat.length;
          }
        }
        if(passed >= 1 && nextPos !== -1){
          passed = i + 2;
          highlightCount = s.lang==="zh" ? nextCp.charEnd : nextCp.wordEnd;
          searchFrom = nextPos + nextLen;
          i++;
          continue;
        }
      }
      break;
    }
  }

  return {
    passed,
    total: cps.length,
    highlightCount,
    finished: passed === cps.length
  };
}

function startSpeechRec(key){
  stopSpeechRec();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const s=state[key];
  if(!SR){
    setStatus(s.scriptId,"当前浏览器不支持语音识别，请使用 Safari 或 Chrome 打开以进行完读校验","warn");
    return;
  }
  const langObj=LANGS.find(l=>l.k===s.lang);
  try{
    const rec = new SR();
    rec.lang = langObj.srLang;
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e)=>{
      if(activeReadKey !== key || s.playingNow || s.waitingForPrompt || s.cooldown) return;
      let sessionText = "";
      for(let i = s.srBaseIndex || 0; i < e.results.length; i++){
        sessionText += e.results[i][0].transcript;
      }
      s.lastResultLen = e.results.length;
      s.currentSessionText = sessionText.trim();
      const fullText = ((s.committedText || "") + " " + (s.currentSessionText || "")).trim();
      s.transcript = fullText;
      if(!fullText) return;

      s.silenceMs = 0;
      s.speaking = true;
      document.getElementById("hb_"+s.scriptId).textContent = `听到：「${fullText}」`;

      const res = checkSequentialCheckpoints(key, fullText);
      if(res.passed > (s.passedStages || 0)){
        s.passedStages = res.passed;
        s.highlightCount = res.highlightCount;
      }
      const pct = Math.round(((s.passedStages || 0) / res.total) * 100);
      highlightUpto(key, s.highlightCount || 0, "done");

      const sc=SCRIPTS.find(x=>x.id===s.scriptId);
      const minMs = sc.minMs[s.lang];

      if(res.finished && s.voicedMs >= minMs * 0.55){
        s.srFinished = true;
        completeOneRepetition(key);
      }else{
        updateMeterUI(
          s.scriptId,
          pct,
          `已读 ${s.passedStages||0}/${res.total} 段 (${pct}%) — 请继续读到句尾…`,
          "speaking"
        );
      }
    };
    rec.onerror = (ev)=>{
      if(ev.error === "not-allowed"){
        setStatus(s.scriptId,"请允许浏览器使用麦克风与语音识别权限","warn");
      }
    };
    rec.onend = ()=>{
      if(activeReadKey === key && srInstance === rec){
        if(s.currentSessionText){
          s.committedText = ((s.committedText || "") + " " + s.currentSessionText).trim();
          s.currentSessionText = "";
        }
        try{ s.srBaseIndex = 0; s.lastResultLen = 0; rec.start(); }catch(err){}
      }
    };
    rec.start();
    srInstance = rec;
  }catch(e){}
}

function stopSpeechRec(){
  if(srInstance){
    const old = srInstance;
    srInstance = null;
    try{ old.stop(); }catch(e){}
  }
}

function resetReadAttempt(key){
  const s=state[key]; if(!s) return;
  s.voicedMs = 0;
  s.silenceMs = 0;
  s.speaking = false;
  s.passedStages = 0;
  s.highlightCount = 0;
  s.srFinished = false;
  s.transcript = "";
  s.committedText = "";
  s.currentSessionText = "";
  s.srBaseIndex = s.lastResultLen || 0;
  highlightUpto(key, 0);
  const hb=document.getElementById("hb_"+s.scriptId);
  if(hb) hb.textContent="";
}

async function ensureMic(){
  if(micStream && micAnalyser) return true;
  const stream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}
  });
  const ctx=getAudioCtx();
  const src=ctx.createMediaStreamSource(stream);
  const analyser=ctx.createAnalyser();
  analyser.fftSize=512;
  src.connect(analyser);
  micStream=stream; micSource=src; micAnalyser=analyser;
  if(!vadTimer) vadTimer=setInterval(vadTick, TICK_MS);
  return true;
}

function releaseMicIfIdle(){
  if(activeReadKey) return;
  if(vadTimer){ clearInterval(vadTimer); vadTimer=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  micSource=null; micAnalyser=null;
  stopSpeechRec();
}

function completeOneRepetition(key){
  const s=state[key];
  if(s.cooldown) return;
  s.cooldown = true;
  const sc=SCRIPTS.find(x=>x.id===s.scriptId);
  const fullLen = s.lang==="zh" ? sc.zh.length : sc.en.split(" ").length;
  highlightUpto(key, fullLen, "done");
  bump(s.scriptId, s.lang);
  updateMeterUI(s.scriptId, 100, "✓ 整句完整读完，+1 已同步云端！", "done");
  setStatus(s.scriptId,"✓ 从头到尾完整读完，已计数 +1","ok");

  setTimeout(()=>{
    if(activeReadKey !== key) return;
    s.cooldown = false;
    resetReadAttempt(key);
    if(s.looping){
      s.waitingForPrompt = true;
      setStatus(s.scriptId,"领读播放中…（听完请完整跟读整句）","");
      speakOnce(key);
    }else{
      updateMeterUI(s.scriptId, 0, "请从头完整念下一遍…", "idle");
    }
  }, 950);
}

function abortIncompleteAttempt(key){
  const s=state[key];
  if(s.cooldown) return;
  s.cooldown = true;
  const sc=SCRIPTS.find(x=>x.id===s.scriptId);
  const totalStages = (s.lang==="zh" ? sc.zhCheckpoints : sc.enCheckpoints).length;
  const passed = s.passedStages || 0;
  const pct = Math.round((passed / totalStages) * 100);

  highlightUpto(key, s.highlightCount || 4, "abort");
  flashCard(s.scriptId, "abort");
  updateMeterUI(s.scriptId, Math.max(10, pct), `⚠️ 未读完整句（仅读 ${passed}/${totalStages} 段），不计数`, "warn");
  setStatus(s.scriptId,`⚠️ 没读到句尾（停在第 ${passed}/${totalStages} 段），本次作废不计数`,"warn");

  setTimeout(()=>{
    if(activeReadKey !== key) return;
    s.cooldown = false;
    resetReadAttempt(key);
    updateMeterUI(s.scriptId, 0, "请从第一句重新完整念到句尾…", "idle");
  }, 1300);
}

function vadTick(){
  if(!activeReadKey || !micAnalyser) return;
  const key = activeReadKey;
  const s = state[key];
  if(s.cooldown) return;

  if(s.looping && (s.playingNow || s.waitingForPrompt)){
    updateMeterUI(s.scriptId, 0, "正在播领读…", "idle");
    return;
  }

  const buf=new Float32Array(micAnalyser.fftSize);
  micAnalyser.getFloatTimeDomainData(buf);
  let sum=0;
  for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
  const rms=Math.sqrt(sum/buf.length);

  if(rms >= VAD_THRESHOLD){
    s.voicedMs += TICK_MS;
    s.silenceMs = 0;
    s.speaking = true;
  }else if(s.speaking){
    s.silenceMs += TICK_MS;
    if(s.srFinished && s.silenceMs >= 300){
      completeOneRepetition(key);
      return;
    }
    if(!s.srFinished && s.silenceMs >= ABORT_SILENCE_MS){
      if((s.passedStages || 0) > 0 || s.voicedMs >= 800){
        abortIncompleteAttempt(key);
      }else{
        resetReadAttempt(key);
      }
    }
  }
}

async function toggleReadLoop(key){
  if(activeReadKey === key){ stopReadLoop(key); return; }
  if(activeReadKey) stopReadLoop(activeReadKey);
  const s=state[key];
  Object.keys(state).forEach(k=>{ if(k!==key) stopListenLoop(k); });

  try{
    await ensureMic();
  }catch(e){
    setStatus(s.scriptId,"无法打开麦克风："+e.message,"warn");
    return;
  }

  activeReadKey = key;
  resetReadAttempt(key);
  s.waitingForPrompt = !!(s.looping && s.playingNow);
  startSpeechRec(key);

  keepAwake(true);
  const btn=document.getElementById("read_"+key);
  btn.textContent="停止读"; btn.classList.add("active");
  document.getElementById("mw_"+s.scriptId).classList.add("on");
  document.getElementById("ml_"+s.scriptId).textContent = `严格完读校验（${s.lang==="zh"?"中文 6 段":"English 6 段"}）`;
  updateMeterUI(s.scriptId, 0, "请从第一句完整念到句尾…", "idle");

  if(s.looping){
    setStatus(s.scriptId,"已开启「领读 + 跟读」：必须按顺序完整跟读到句尾最后一个词才 +1","");
  }else{
    setStatus(s.scriptId,"循环读已开启 —— 必须从头完整念到句尾才计数（中途停下作废）","");
  }
}

function stopReadLoop(key){
  const s=state[key]; if(!s) return;
  if(activeReadKey === key) activeReadKey = null;
  resetReadAttempt(key);
  const btn=document.getElementById("read_"+key);
  if(btn){ btn.textContent="🎙️ 循环读"; btn.classList.remove("active"); }
  const mw=document.getElementById("mw_"+s.scriptId);
  if(mw) mw.classList.remove("on");
  if(s.looping){
    setStatus(s.scriptId,"循环听中（只听不计数）…","");
  }else{
    setStatus(s.scriptId,"","");
  }
  releaseMicIfIdle();
  keepAwake(anyActive());
}

function updateMeterUI(id, pct, text, mode){
  const fill=document.getElementById("mf_"+id);
  const txt=document.getElementById("mt_"+id);
  if(fill){
    fill.style.width=pct+"%";
    fill.classList.remove("done","warn");
    if(mode==="done") fill.classList.add("done");
    if(mode==="warn") fill.classList.add("warn");
  }
  if(txt){
    txt.textContent=text;
    txt.classList.remove("speaking","warn");
    if(mode==="speaking" || mode==="done") txt.classList.add("speaking");
    if(mode==="warn") txt.classList.add("warn");
  }
}

function setStatus(id,msg,cls){
  const el=document.getElementById("st_"+id);
  if(!el) return;
  el.textContent=msg;
  el.className="status"+(cls?" "+cls:"");
}

function renderCounts(id){
  const c=getLocalCounts(id);
  const cntEl=document.getElementById("cnt_"+id);
  const subEl=document.getElementById("cntsub_"+id);
  if(cntEl) cntEl.textContent=`今天 ${c.today} 遍 · 累计 ${c.total} 遍`;
  if(subEl){
    if(c.today_zh || c.today_en){
      subEl.textContent=`今日明细：中 ${c.today_zh} · EN ${c.today_en}`;
    }else{
      subEl.textContent=`仅完整读完自动计数`;
    }
  }
  renderHistoryRow(id);
}

function renderHistoryRow(id){
  const row=document.getElementById("hist_"+id);
  if(!row) return;
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(Date.now() - i*86400000);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const label = i===0 ? "今" : `${d.getMonth()+1}/${d.getDate()}`;
    let cnt = 0;
    if(i===0){
      cnt = getLocalCounts(id).today;
    }else{
      const found = cloudHistory.find(h=>h.date===ds && h.script_id===id);
      if(found) cnt = Number(found.count||0);
    }
    days.push(`<span class="dayPill ${cnt>0?"has":""}">${label}: ${cnt}</span>`);
  }
  row.innerHTML = `<span>近7天云端记录：</span>` + days.join("");
}

// ---------- render ----------
const wrap=document.getElementById("cards");
SCRIPTS.forEach(sc=>{
  const div=document.createElement("div");
  div.className="card";
  div.id="card_"+sc.id;
  let tracks="";
  LANGS.forEach(l=>{
    const key=sc.id+"_"+l.k;
    state[key]={
      looping:false, playingNow:false, scriptId:sc.id, lang:l.k,
      voicedMs:0, silenceMs:0, speaking:false, passedStages:0, highlightCount:0, srFinished:false
    };
    tracks+=`
    <div class="track">
      <span class="label">${l.label}</span>
      <button id="read_${key}" class="readBtn">🎙️ 循环读</button>
      <button id="play_${key}" class="secondary">🔊 循环听</button>
    </div>`;
  });
  div.innerHTML=`
    <div class="zh" id="txt_${sc.id}_zh">${renderSentenceHtml(sc,"zh")}</div>
    <div class="en" id="txt_${sc.id}_en">${renderSentenceHtml(sc,"en")}</div>
    ${tracks}
    <div class="meterWrap" id="mw_${sc.id}">
      <div class="meterTop">
        <span class="meterLabel" id="ml_${sc.id}">完读进度</span>
        <span class="meterText" id="mt_${sc.id}">请从第一句完整念到句尾…</span>
      </div>
      <div class="meterBg"><div class="meterFill" id="mf_${sc.id}"></div></div>
      <div class="heardBox" id="hb_${sc.id}"></div>
    </div>
    <div class="status" id="st_${sc.id}"></div>
    <div class="counts">
      <span class="countMain" id="cnt_${sc.id}"></span>
      <span class="countSub" id="cntsub_${sc.id}">仅完整读完自动计数</span>
    </div>
    <div class="historyRow" id="hist_${sc.id}"></div>`;
  wrap.appendChild(div);
  LANGS.forEach(l=>{
    const key=sc.id+"_"+l.k;
    document.getElementById("play_"+key).onclick=()=>toggleListenLoop(key);
    document.getElementById("read_"+key).onclick=()=>toggleReadLoop(key);
  });
  renderCounts(sc.id);
});

initCloudSync();

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    if(anyActive()) keepAwake(true);
    initCloudSync();
  }
});
</script>
